name: Project Item Unarchiveren en Status naar Ready

on:
  issues:
    types: [reopened]
  pull_request:
    types: [reopened]

jobs:
  unarchive-and-move:
    runs-on: ubuntu-latest
    env:
      # Hier splitsen we de URL op om de CLI-fout te voorkomen
      PROJECT_OWNER: "Qluster-IT"
      PROJECT_NUMBER: 1
      GITHUB_TOKEN: ${{ secrets.PAT }}
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}

    steps:
      - name: Haal item info op uit het project
        id: item_info
        run: |
          # We gebruiken nu --owner en het losse projectnummer
          ITEM_DATA=$(gh project item-list ${{ env.PROJECT_NUMBER }} --owner "${{ env.PROJECT_OWNER }}" --format json | jq -r --arg id "$ISSUE_NODE_ID" '.items[] | select(.content.id == $id)')
          ITEM_ID=$(echo "$ITEM_DATA" | jq -r '.id // empty')
          IS_ARCHIVED=$(echo "$ITEM_DATA" | jq -r '.isArchived // false')
          
          echo "item_id=$ITEM_ID" >> $GITHUB_OUTPUT
          echo "is_archived=$IS_ARCHIVED" >> $GITHUB_OUTPUT

      - name: Unarchive het projectitem
        if: steps.item_info.outputs.item_id != '' && steps.item_info.outputs.is_archived == 'true'
        run: |
          gh api graphql -f query='
            mutation($itemId: ID!) {
              unarchiveProjectV2Item(input: {itemId: $itemId}) {
                projectV2Item { id }
              }
            }
          ' -f itemId="${{ steps.item_info.outputs.item_id }}"

      - name: Zet status op Ready
        if: steps.item_info.outputs.item_id != ''
        run: |
          # Ook hier gebruiken we nu het projectnummer en de owner in plaats van de URL string
          gh project item-edit ${{ env.PROJECT_NUMBER }} --owner "${{ env.PROJECT_OWNER }}" --id "${{ steps.item_info.outputs.item_id }}" --field "Status" --value "Ready"
